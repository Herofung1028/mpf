name: 更新強積金價格

on:
  schedule:
    # 香港時間每日約 09:40 同 21:40 各檢查一次
    - cron: '40 1 * * *'
    - cron: '40 13 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: '下載以前月份嘅積金局價格表（第一次設定時揀 true）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝工具
        run: |
          npm install --no-save --no-package-lock playwright@1 xlsx@0.18.5
          npx playwright install --with-deps chromium
      - name: 取得基金價格
        run: node update.mjs ${{ inputs.backfill && 'backfill' || '' }}
      - name: 儲存
        run: |
          if [ -n "$(git status --porcelain data debug)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data debug
            git commit -m "更新強積金價格"
            git push
          else
            echo "冇新資料"
          fi
